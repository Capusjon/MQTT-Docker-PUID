services:
  mosquitto:
    image: capusjon/mqtt-docker-puid:latest   # of 'build: .' voor een lokale build
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"   # optioneel: WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      PUID: 1000
      PGID: 1000
